[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ict-pipeline"
version = "0.1.0"
description = "CLI for the ICT manufacturing defect detection pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2,<3",
    "python-dotenv>=1,<2",
    "PyYAML>=6,<7",
    "rich>=13",
    "typer>=0.16",
]

[project.optional-dependencies]
preprocess = ["Pillow>=10", "openpyxl>=3.1"]
test = ["pytest>=8", "Pillow>=10", "openpyxl>=3.1"]

[project.scripts]
ict = "ict_pipeline.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ict_pipeline", "ict_pipeline.*"]
namespaces = false

[tool.setuptools.package-data]
"ict_pipeline.config" = ["default.yaml"]
"ict_pipeline.data" = ["aihub_smt.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
