[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ict-pipeline"
version = "0.1.0"
description = "CLI for the ICT manufacturing defect detection pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2,<3",
    "python-dotenv>=1,<2",
    "PyYAML>=6,<7",
    "rich>=13",
    "typer>=0.16",
]

[project.optional-dependencies]
preprocess = ["Pillow>=10", "openpyxl>=3.1"]
test = ["pytest>=8", "Pillow>=10", "openpyxl>=3.1"]
mlflow = ["mlflow>=2.17,<4"]
train-yolo = ["torch>=2.6", "torchvision>=0.21", "ultralytics==8.3.228"]
train-faster-rcnn = ["torch>=2.6", "torchvision>=0.21", "Pillow>=10"]
train-rt-detr = ["torch>=2.6", "torchvision>=0.21", "Pillow>=10", "transformers==4.57.6", "scipy>=1.10"]
pretrained-safetensors = ["safetensors>=0.4.3"]

[project.scripts]
ict = "ict_pipeline.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ict_pipeline", "ict_pipeline.*"]
namespaces = false

[tool.setuptools.package-data]
"ict_pipeline.config" = ["default.yaml"]
"ict_pipeline.data" = ["aihub_smt.yaml"]
"ict_pipeline.models" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: local fixture-based CLI workflows",
    "cpu_backend: real detector training with tiny synthetic datasets",
    "real_data_smoke: opt-in real SMT training with staged weights",
]
