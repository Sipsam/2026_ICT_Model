name: Runtime executor tests

on:
  push:
  pull_request:

jobs:
  cpu-runtime:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install ".[test]"
      - run: python -m pytest -q tests/test_runtime.py tests/test_pipeline.py
